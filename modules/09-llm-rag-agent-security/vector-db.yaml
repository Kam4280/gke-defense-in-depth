apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-vectordb
  namespace: mlops-secops
  labels:
    app.kubernetes.io/name: qdrant-vectordb
    app.kubernetes.io/component: vector-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant-vectordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant-vectordb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.7.4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 6333
              name: http
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
            - name: qdrant-snapshots
              mountPath: /qdrant/snapshots
      volumes:
        - name: qdrant-storage
          emptyDir: {}
        - name: qdrant-snapshots
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: mlops-secops
spec:
  selector:
    app.kubernetes.io/name: qdrant-vectordb
  ports:
    - protocol: TCP
      port: 6333
      targetPort: 6333
  type: ClusterIP